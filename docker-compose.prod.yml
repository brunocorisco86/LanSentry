services:
  lansentry-wyl:
    image: aceberg/watchyourlan:v2
    container_name: lansentry-wyl
    restart: unless-stopped
    network_mode: "host"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      IFACES: ${IFACES:-eth0}
      PORT: ${WYL_INTERNAL_PORT:-8841}
      USE_DB: "postgres"
      PG_CONNECT: "postgres://${POSTGRES_USER:-lansentry}:${POSTGRES_PASSWORD:-lansentry_secure_prod_pi}@127.0.0.1:5432/${POSTGRES_DB:-lansentry}?sslmode=disable"
      SHOUTRRR_URL: ${SHOUTRRR_URL:-ntfy://ntfy.sh/bruno-casa-dallas}
    volumes:
      - ./data/wyl:/data/WatchYourLAN

  lansentry-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    container_name: lansentry-sidecar
    restart: unless-stopped
    network_mode: "host"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      PG_CONNECT: "postgres://${POSTGRES_USER:-lansentry}:${POSTGRES_PASSWORD:-lansentry_secure_prod_pi}@127.0.0.1:5432/${POSTGRES_DB:-lansentry}?sslmode=disable"
      PIHOLE_GRAVITY_DB: "/etc/pihole/gravity.db"
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-30}
      NTFY_TOPIC: ${NTFY_TOPIC:-bruno-casa-dallas}
      DNS_SERVER: ${DNS_SERVER:-127.0.0.1}
      SERVER_HOST: ${SERVER_HOST:-192.168.1.7}
      PROXY_PORT: ${WYL_PORT:-8840}
      WYL_TARGET: "http://127.0.0.1:${WYL_INTERNAL_PORT:-8841}"
    volumes:
      - ./sidecar/sidecar.py:/app/sidecar.py:ro
      - ./sidecar/custom.js:/app/custom.js:ro
      - /etc/pihole/gravity.db:/etc/pihole/gravity.db
